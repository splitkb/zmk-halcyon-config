# RGB settings
# We want to keep these enabled for CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB,
# as this can disable ext_power with a USB unplug. You may want to remove
# this if you're using a nice!view or OLED display with LiPo batteries.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50

# Uncomment these two line to add support for soldered encoders to your firmware
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the OLED Display
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_EXT_POWER_START=y
